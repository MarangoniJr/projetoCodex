# Use como novo arquivo somente se ainda não existe um bloco para risti.com.br.
# Se já existir, adapte o bloco atual; não duplique server_name nem remova TLS.
server {
    listen 80;
    server_name risti.com.br;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:3087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
    }
}
