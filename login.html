<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar — RISTI</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/login.css"></head>
<body class="login-page"><main class="login-card">
  <svg class="brand-logo" viewBox="0 0 300 266" role="img" aria-label="RISTI">
    <defs><linearGradient id="brand"><stop stop-color="#1373ad"/><stop offset="1" stop-color="#20a8da"/></linearGradient></defs>
    <g fill="url(#brand)">
      <path id="connection" d="M100 0a31 31 0 1 0 24 51q26-34 52 0a31 31 0 1 0 0-40q-26 34-52 0A31 31 0 0 0 100 0Z" transform="translate(0 1)"/>
      <use href="#connection" transform="translate(-52 53)"/>
      <use href="#connection" transform="translate(0 105)"/>
      <circle cx="253" cy="84" r="31"/>
    </g>
    <g fill="#1674ad">
      <path d="M0 183h62q21 0 21 25v2q0 18-17 23l29 33H73l-49-50h32q10 0 10-9t-10-8H17v67H0Z"/>
      <path d="M90 183h17v83H90Z M188 183h-51q-30 0-30 25t30 25h27q10 0 10 8t-10 8h-54v17h54q26 0 26-25t-26-25h-27q-12 0-12-8t12-8h51Z"/>
    </g>
    <path fill="#20a8da" d="M196 183h82v17h-32v66h-18v-66h-32Z M284 183h16v83h-16Z"/>
  </svg>
  <h1 class="product-title">Reembolso <span>RISTI</span></h1>
  <h2 id="formTitle" class="visually-hidden">Entrar na sua conta</h2>
  <form id="loginForm">
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="Ex: nome@risti.com.br" autocomplete="username" maxlength="254" required autofocus></div>
    <div class="field"><label for="password">Senha</label><div class="password-field"><input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" maxlength="256" required><button id="showPassword" class="show-password" type="button" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <p id="loginStatus" role="status" aria-live="polite" hidden></p>
    <button id="submitLogin" class="primary-button" type="submit">Entrar</button>
  </form>
  <div class="account-actions"><button id="toggleMode" type="button">Cadastrar conta</button><button id="recoverPassword" type="button">Recuperar senha</button></div>
  <dialog id="recoveryDialog" aria-labelledby="recoveryTitle"><h2 id="recoveryTitle">Recuperar senha</h2><p>Para redefinir sua senha, entre em contato com o administrador e informe o e-mail cadastrado na sua conta.</p><p>A recuperação por e-mail ainda não está disponível.</p><form method="dialog"><button class="primary-button">Voltar ao login</button></form></dialog>
</main><script src="/login.js" defer></script></body></html>
